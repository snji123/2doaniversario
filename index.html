<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c0f16;
    --surface:#2a1520;
    --surface-2:#331a27;
    --text:#f4e7de;
    --text-dim:#c79aa4;
    --accent:#caa15c;
    --accent-soft:#7d5230;
    --divider: rgba(244,231,222,0.12);
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#fbf1e9;
      --surface:#ffffff;
      --surface-2:#f4e3d3;
      --text:#3a1c22;
      --text-dim:#8a5a5f;
      --accent:#a9702c;
      --accent-soft:#e7cba3;
      --divider: rgba(58,28,34,0.12);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c0f16; --surface:#2a1520; --surface-2:#331a27;
    --text:#f4e7de; --text-dim:#c79aa4; --accent:#caa15c;
    --accent-soft:#7d5230; --divider: rgba(244,231,222,0.12);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--sans);
    -webkit-tap-highlight-color:transparent;
  }
  body{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex; flex-direction:column; min-height:100%;
  }
  .wrap{ max-width:480px; margin:0 auto; width:100%; flex:1; display:flex; flex-direction:column; }

  header.hero{
    padding:28px 22px 18px;
    background:linear-gradient(180deg, var(--surface-2), var(--bg) 85%);
  }
  .eyebrow-free{ font-family:var(--serif); font-size:26px; font-weight:600; margin:0 0 4px; }
  .clock{
    margin-top:14px; padding:16px 18px; border-radius:18px;
    background:var(--surface); border:1px solid var(--divider);
  }
  .clock .label{ font-size:13px; color:var(--text-dim); margin-bottom:6px; }
  .clock .value{ font-family:var(--serif); font-size:22px; letter-spacing:0.2px; }
  .clock .value b{ font-weight:600; color:var(--accent); }

  nav.tabs{
    display:flex; gap:6px; padding:14px 22px 0;
  }
  nav.tabs button{
    flex:1; padding:10px 0; border:none; background:none; color:var(--text-dim);
    font-family:var(--sans); font-size:14px; font-weight:600; cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav.tabs button.active{ color:var(--text); border-bottom-color:var(--accent); }

  main{ flex:1; padding:16px 22px 24px; }

  .song{
    display:flex; align-items:center; gap:14px; padding:12px 10px;
    border-radius:14px; cursor:pointer; border:1px solid transparent;
  }
  .song:active{ background:var(--surface); border-color:var(--divider); }
  .cover{
    width:56px; height:56px; border-radius:10px; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:20px; color:rgba(255,255,255,0.85);
  }
  .meta .title{ font-weight:600; font-size:15px; }
  .meta .artist{ font-size:13px; color:var(--text-dim); margin-top:2px; }

  .empty{
    margin-top:40px; text-align:center; color:var(--text-dim); font-size:14px; line-height:1.6;
  }
  .empty span{ display:block; font-family:var(--serif); font-size:20px; color:var(--text); margin-bottom:6px; }

  /* Detail overlay */
  .sheet{
    position:fixed; inset:0; background:var(--bg); z-index:20;
    display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .32s ease;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .sheet.open{ transform:translateY(0); }
  .sheet-inner{ max-width:480px; margin:0 auto; width:100%; flex:1; display:flex; flex-direction:column; padding:18px 22px 28px; overflow-y:auto; }
  .close-btn{
    align-self:flex-start; background:var(--surface); border:1px solid var(--divider);
    color:var(--text); font-size:14px; padding:8px 14px; border-radius:999px; cursor:pointer; margin-bottom:18px;
  }
  .big-cover{
    width:100%; aspect-ratio:1/1; border-radius:20px; margin-bottom:18px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:44px; color:rgba(255,255,255,0.9);
  }
  .sheet h2{ font-family:var(--serif); font-size:26px; margin:0 0 2px; font-weight:600; }
  .sheet .by{ color:var(--text-dim); font-size:14px; margin-bottom:18px; }
  audio{ width:100%; margin-bottom:22px; }
  .block{ margin-bottom:20px; }
  .block h3{ font-size:12px; text-transform:none; color:var(--accent); margin:0 0 8px; font-weight:600; }
  .block p{ margin:0; font-size:15px; line-height:1.6; }
  .phrase{ font-family:var(--serif); font-style:italic; font-size:19px; line-height:1.5; }
  .note-box{
    background:var(--surface); border:1px solid var(--divider); border-radius:16px; padding:16px;
  }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <p class="eyebrow-free">Para ti</p>
    <div class="clock">
      <div class="label">Llevamos juntos</div>
      <div class="value" id="clockValue">calculando…</div>
    </div>
  </header>

  <nav class="tabs">
    <button class="active" data-tab="canciones">Canciones</button>
    <button data-tab="album">Álbum</button>
  </nav>

  <main>
    <section id="panel-canciones"></section>
    <section id="panel-album" style="display:none;">
      <div class="empty">
        <span>Álbum de fotos</span>
        Aquí vamos a guardar nuestras fotos favoritas. Muy pronto.
      </div>
    </section>
  </main>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <button class="close-btn" id="closeSheet">← Volver</button>
    <div class="big-cover" id="sheetCover"></div>
    <h2 id="sheetTitle"></h2>
    <div class="by" id="sheetArtist"></div>
    <audio controls id="sheetAudio"></audio>
    <div class="block">
      <h3>La frase</h3>
      <p class="phrase" id="sheetPhrase"></p>
    </div>
    <div class="block">
      <h3>Lo que significa</h3>
      <p id="sheetMeaning"></p>
    </div>
    <div class="block">
      <h3>Mi nota para ti</h3>
      <div class="note-box"><p id="sheetNote"></p></div>
    </div>
  </div>
</div>

<script>
  // ----- Fecha de inicio: cámbiala por la fecha real -----
  const START_DATE = new Date("2024-01-01T00:00:00");

  function updateClock(){
    const now = new Date();
    let diff = Math.max(0, now - START_DATE);
    const day = 86400000, hour = 3600000, min = 60000;
    const days = Math.floor(diff / day); diff -= days*day;
    const hours = Math.floor(diff / hour); diff -= hours*hour;
    const mins = Math.floor(diff / min); diff -= mins*min;
    const secs = Math.floor(diff / 1000);
    document.getElementById('clockValue').innerHTML =
      `<b>${days}</b> días, <b>${hours}</b> h, <b>${mins}</b> m, <b>${secs}</b> s`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ----- Datos de ejemplo: reemplaza frase/significado/nota/audio por lo real -----
  const songs = [
    { title:"Mary Es Mi Amor", artist:"—", grad:"linear-gradient(135deg,#7a2f4a,#c98a3e)",
      audio:"canciones/song1.mp3",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción para ustedes.",
      note:"Escribe tu dedicatoria para esta canción." },
    { title:"Si Supieras", artist:"—", grad:"linear-gradient(135deg,#4a2a5c,#a9702c)",
      audio:"canciones/song2.mp3",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción para ustedes.",
      note:"Escribe tu dedicatoria para esta canción." },
    { title:"San Lucas", artist:"—", grad:"linear-gradient(135deg,#5c2a3a,#caa15c)",
      audio:"canciones/song3.mp3",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción para ustedes.",
      note:"Escribe tu dedicatoria para esta canción." },
    { title:"Zoe Luna", artist:"—", grad:"linear-gradient(135deg,#2a3a5c,#7d5230)",
      audio:"canciones/song4.mp3",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción para ustedes.",
      note:"Escribe tu dedicatoria para esta canción." },
    { title:"Tú Sí Eres Real", artist:"—", grad:"linear-gradient(135deg,#7a2f4a,#4a2a5c)",
      audio:"canciones/song5.mp3",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción para ustedes.",
      note:"Escribe tu dedicatoria para esta canción." }
  ];

  const list = document.getElementById('panel-canciones');
  songs.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'song';
    row.innerHTML = `
      <div class="cover" style="background:${s.grad}">♪</div>
      <div class="meta">
        <div class="title">${s.title}</div>
        <div class="artist">${s.artist}</div>
      </div>`;
    row.addEventListener('click', () => openSheet(i));
    list.appendChild(row);
  });

  const sheet = document.getElementById('sheet');
  function openSheet(i){
    const s = songs[i];
    document.getElementById('sheetCover').style.background = s.grad;
    document.getElementById('sheetCover').textContent = '♪';
    document.getElementById('sheetTitle').textContent = s.title;
    document.getElementById('sheetArtist').textContent = s.artist;
    document.getElementById('sheetAudio').src = s.audio;
    document.getElementById('sheetPhrase').textContent = s.phrase;
    document.getElementById('sheetMeaning').textContent = s.meaning;
    document.getElementById('sheetNote').textContent = s.note;
    sheet.classList.add('open');
  }
  document.getElementById('closeSheet').addEventListener('click', () => {
    sheet.classList.remove('open');
    document.getElementById('sheetAudio').pause();
  });

  // Tabs
  document.querySelectorAll('nav.tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('panel-canciones').style.display = tab==='canciones' ? '' : 'none';
      document.getElementById('panel-album').style.display = tab==='album' ? '' : 'none';
    });
  });
</script>
</body>
</html>
