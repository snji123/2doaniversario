<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --surface:#181818;
    --surface-2:#282828;
    --surface-hover:#2a2a2a;
    --text:#ffffff;
    --text-dim:#a7a7a7;
    --green:#1ed760;
    --green-dim:#1aa34a;
    --divider: rgba(255,255,255,0.08);
    --font: 'Poppins', -apple-system, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root[data-theme="light"]{
      --bg:#f5f5f5; --surface:#ffffff; --surface-2:#ececec; --surface-hover:#e6e6e6;
      --text:#0a0a0a; --text-dim:#5c5c5c; --divider: rgba(0,0,0,0.08);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow-x:hidden;}
  body{padding-top:env(safe-area-inset-top,0px);}
  ::-webkit-scrollbar{display:none;}

  .wrap{max-width:480px;margin:0 auto;width:100%;padding-bottom:110px;}

  /* Hero */
  .hero{
    position:relative; padding:22px 20px 24px;
    background:radial-gradient(120% 160% at 30% -10%, #3a1030 0%, #1a0a17 45%, var(--bg) 78%);
    overflow:hidden;
  }
  .hero::after{
    content:''; position:absolute; inset:0;
    background:radial-gradient(60% 50% at 80% 0%, rgba(30,215,96,0.18), transparent 70%);
    pointer-events:none;
  }
  .greeting{font-size:13px;color:var(--text-dim);font-weight:500;position:relative;z-index:1;}
  .playlist-title{
    font-size:34px; font-weight:800; margin:6px 0 4px; letter-spacing:-0.5px;
    position:relative; z-index:1;
  }
  .playlist-sub{font-size:13px;color:var(--text-dim);position:relative;z-index:1;}

  .hero-actions{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:22px; position:relative; z-index:1;
  }
  .icon-btn{
    width:32px;height:32px;border-radius:50%;border:none;background:transparent;
    color:var(--text-dim); display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .play-fab{
    width:56px;height:56px;border-radius:50%;background:var(--green);border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 8px 20px rgba(30,215,96,0.35);
    transition:transform .15s ease;
  }
  .play-fab:active{transform:scale(0.92);}
  .play-fab svg{fill:#0a0a0a;margin-left:3px;}

  /* Stat / clock chip */
  .stat-chip{
    margin:0 20px 6px; padding:14px 16px; border-radius:14px;
    background:var(--surface); border:1px solid var(--divider);
    display:flex; align-items:center; gap:12px;
  }
  .stat-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 8px var(--green);}
  .stat-chip .txt{font-size:13px;color:var(--text-dim);}
  .stat-chip .txt b{color:var(--text);font-weight:700;}

  /* Tabs */
  .tabs{display:flex;gap:8px;padding:16px 20px 6px;}
  .tabs button{
    padding:7px 16px;border-radius:999px;border:1px solid var(--divider);
    background:var(--surface);color:var(--text-dim);font-family:var(--font);
    font-size:13px;font-weight:600;cursor:pointer;transition:.15s ease;
  }
  .tabs button.active{background:var(--text);color:#0a0a0a;border-color:var(--text);}

  main{padding:8px 12px 0;}

  /* Track row */
  .track{
    display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:8px;
    cursor:pointer;transition:background .12s ease;position:relative;
  }
  .track:active{background:var(--surface-hover);}
  .t-num{width:20px;flex:none;text-align:center;font-size:14px;font-weight:600;color:var(--text-dim);}
  .track.playing .t-num{color:var(--green);}
  .cover{
    width:48px;height:48px;border-radius:6px;flex:none;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-size:18px;
    box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  .cover .bars{display:flex;gap:2px;align-items:flex-end;height:14px;opacity:0;transition:opacity .15s;}
  .track.playing .cover .bars{opacity:1;}
  .cover .bars span{width:3px;background:var(--green);border-radius:2px;animation:eq 0.8s ease-in-out infinite;}
  .cover .bars span:nth-child(2){animation-delay:.2s;}
  .cover .bars span:nth-child(3){animation-delay:.4s;}
  @keyframes eq{0%,100%{height:4px;}50%{height:14px;}}
  .t-meta{flex:1;min-width:0;}
  .t-title{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track.playing .t-title{color:var(--green);}
  .t-artist{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .heart{width:20px;height:20px;flex:none;color:var(--text-dim);}

  .empty{margin-top:60px;text-align:center;color:var(--text-dim);font-size:14px;padding:0 30px;}
  .empty span{display:block;font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;}

  /* Mini player */
  .miniplayer{
    position:fixed;left:0;right:0;bottom:0;z-index:15;
    background:linear-gradient(135deg,#2a1030,#1a1a1a);
    border-top:1px solid var(--divider);
    padding:10px 14px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
    display:none; align-items:center; gap:12px;
    transform:translateY(0); transition:transform .25s ease;
  }
  .miniplayer.show{display:flex;cursor:pointer;}
  .mp-cover{width:40px;height:40px;border-radius:6px;flex:none;}
  .mp-meta{flex:1;min-width:0;}
  .mp-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mp-artist{font-size:11px;color:var(--text-dim);}
  .mp-play{width:34px;height:34px;border-radius:50%;background:var(--green);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .mp-play svg{fill:#0a0a0a;}
  .mp-progress{position:absolute;top:0;left:0;height:2px;background:var(--green);width:0%;transition:width .1s linear;}

  /* Detail sheet */
  .sheet{
    position:fixed;inset:0;background:var(--bg);z-index:30;
    transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .sheet.open{transform:translateY(0);}
  .sheet-bg{position:absolute;inset:0;z-index:-1;opacity:.55;}
  .sheet-inner{max-width:480px;margin:0 auto;width:100%;flex:1;overflow-y:auto;padding:16px 20px 40px;}
  .close-btn{
    width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;
    color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:20px;
  }
  .big-cover{width:100%;aspect-ratio:1/1;border-radius:12px;margin-bottom:20px;box-shadow:0 16px 40px rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;font-size:56px;position:relative;overflow:hidden;}
  .sheet-player-overlay{
    position:absolute;left:0;right:0;bottom:0;padding:20px 16px 16px;
    background:linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
  }
  .sheet-progress-bar{height:3px;border-radius:2px;background:rgba(255,255,255,0.25);margin-bottom:6px;cursor:pointer;overflow:hidden;}
  .sheet-progress-fill{height:100%;width:0%;background:var(--green);border-radius:2px;}
  .sheet-times{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.85);margin-bottom:10px;}
  .sheet-controls-row{display:flex;align-items:center;justify-content:center;gap:26px;}
  .sheet-nav-btn{background:none;border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:6px;}
  .sheet-nav-btn svg{fill:currentColor;}
  .sheet-play-btn{
    width:50px;height:50px;border-radius:50%;background:var(--green);border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.45);flex:none;
  }
  .sheet-play-btn svg{fill:#0a0a0a;margin-left:2px;}
  .sheet h2{font-size:24px;font-weight:800;margin:0 0 2px;letter-spacing:-0.3px;}
  .sheet .by{color:var(--text-dim);font-size:13px;margin-bottom:16px;}
  audio{width:100%;margin-bottom:24px;accent-color:var(--green);}
  .block{margin-bottom:18px;}
  .block h3{font-size:11px;letter-spacing:.3px;color:var(--green);margin:0 0 8px;font-weight:700;}
  .block p{margin:0;font-size:15px;line-height:1.6;}
  .phrase{font-style:italic;font-weight:500;font-size:18px;line-height:1.5;}
  .note-box{background:var(--surface);border:1px solid var(--divider);border-radius:14px;padding:16px;}
  .note-box textarea{
    width:100%;background:transparent;border:none;color:var(--text);font-family:var(--font);
    font-size:14px;line-height:1.5;resize:vertical;min-height:70px;padding:0;margin-bottom:10px;
  }
  .save-btn{
    background:var(--green);color:#0a0a0a;border:none;border-radius:999px;
    padding:8px 18px;font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font);
  }
  .heart.liked{color:var(--green);fill:var(--green);}

  .add-photo-form{display:flex;flex-direction:column;gap:8px;padding:4px 8px 18px;}
  .add-photo-form input{
    background:var(--surface);border:1px solid var(--divider);color:var(--text);
    border-radius:10px;padding:11px 14px;font-family:var(--font);font-size:13px;
  }
  .photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 8px 20px;}
  .photo-item{border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--divider);}
  .photo-item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--surface-2);}
  .photo-cap{font-size:12px;color:var(--text-dim);padding:8px 10px;}

  /* ---- Login (portón) ---- */
  body.locked{overflow:hidden;}
  .gate{
    position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
    background:radial-gradient(120% 90% at 50% -10%, #3a1030 0%, #160a14 50%, #0a0a0a 85%);
    transition:opacity .5s ease, visibility .5s;
  }
  .gate{--text:#fff;--text-dim:#a7a7a7;--divider:rgba(255,255,255,0.1);color:#fff;}
  .gate.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .gate-step{width:100%;max-width:380px;text-align:center;display:none;animation:gateIn .5s ease both;}
  .gate-step.active{display:block;}
  @keyframes gateIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .gate h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0 0 6px;}
  .gate p.sub{color:var(--text-dim);font-size:14px;margin:0 0 28px;}
  .role-card{
    width:100%;display:flex;align-items:center;gap:14px;padding:18px;margin-bottom:12px;
    border-radius:16px;background:rgba(255,255,255,0.05);border:1px solid var(--divider);
    color:var(--text);font-family:var(--font);font-size:18px;font-weight:700;cursor:pointer;text-align:left;
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .role-card:active{transform:scale(.97);background:rgba(30,215,96,0.12);border-color:var(--green);}
  .role-card .emo{font-size:28px;}
  .role-card small{display:block;font-size:12px;font-weight:500;color:var(--text-dim);margin-top:2px;}
  .picker{
    position:relative;display:flex;gap:6px;justify-content:center;height:220px;margin:0 0 22px;
    border-radius:18px;background:rgba(255,255,255,0.04);border:1px solid var(--divider);overflow:hidden;
  }
  .picker::before{
    content:'';position:absolute;left:10px;right:10px;top:88px;height:44px;border-radius:12px;
    background:rgba(30,215,96,0.14);border:1px solid rgba(30,215,96,0.45);pointer-events:none;
  }
  .picker::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(#0d0710 0%, rgba(13,7,16,0) 32%, rgba(13,7,16,0) 68%, #0d0710 100%);
  }
  .wheel{
    flex:1;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;
    padding:88px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .wheel.w-month{flex:1.6;}
  .wheel.w-year{flex:1.2;}
  .wheel div{
    height:44px;line-height:44px;scroll-snap-align:center;font-size:17px;font-weight:500;
    color:rgba(255,255,255,0.35);transition:color .15s, font-size .15s;
  }
  .wheel div.sel{color:#fff;font-weight:700;font-size:20px;}
  .gate-btn{
    width:100%;padding:15px;border:none;border-radius:999px;background:var(--green);color:#0a0a0a;
    font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s;
    box-shadow:0 10px 24px rgba(30,215,96,0.3);
  }
  .gate-btn:active{transform:scale(.97);}
  .gate-back{background:none;border:none;color:var(--text-dim);font-family:var(--font);font-size:13px;margin-top:16px;cursor:pointer;}
  .gate-err{min-height:20px;color:#ff7a7a;font-size:13px;margin-bottom:12px;}
  .shake{animation:shake .4s ease;}
  @keyframes shake{20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}

  .pair{position:relative;display:flex;justify-content:center;margin-bottom:12px;}
  .pair svg{animation:bob 3s ease-in-out infinite;}
  .pair svg:first-child{margin-right:-10px;}
  .pair svg:nth-child(2){animation-delay:.5s;}
  .pair-heart{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:20px;animation:floaty 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  @keyframes floaty{0%,100%{transform:translate(-50%,0);opacity:.9;}50%{transform:translate(-50%,-6px);opacity:1;}}

  .duo-wrap{display:flex;justify-content:center;margin:-10px 0 4px;}
  .duo{animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(244,154,184,.25));}

  .avatar-btn{position:absolute;top:16px;right:16px;z-index:3;width:44px;height:44px;border-radius:50%;padding:0;border:2px solid var(--green);background:#2a1520;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .15s;}
  .avatar-btn:active{transform:scale(.92);}
  .avatar-btn img{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar-btn svg{width:36px;height:34px;}
  .p-back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;opacity:0;visibility:hidden;transition:opacity .25s, visibility .25s;}
  .p-back.open{opacity:1;visibility:visible;}
  .psheet{
    position:fixed;left:50%;bottom:0;width:min(480px,100%);z-index:61;background:#181818;color:#fff;
    border-radius:22px 22px 0 0;padding:12px 24px calc(26px + env(safe-area-inset-bottom,0px));
    transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.32,.72,0,1);text-align:center;
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
  }
  .psheet.open{transform:translate(-50%,0);}
  .p-handle{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:0 auto 18px;}
  .p-avatar-wrap{position:relative;width:104px;height:104px;margin:0 auto 10px;}
  .p-avatar{width:104px;height:104px;border-radius:50%;overflow:hidden;background:#2a1520;border:3px solid var(--green);display:flex;align-items:center;justify-content:center;}
  .p-avatar img{width:100%;height:100%;object-fit:cover;}
  .p-avatar svg{width:84px;height:78px;}
  .p-cam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--green);border:3px solid #181818;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
  .p-cam svg{fill:none;stroke:#0a0a0a;stroke-width:2;}
  .p-role{font-size:12px;color:var(--text-dim);margin-bottom:18px;}
  .p-label{display:block;text-align:left;font-size:11px;color:var(--green);font-weight:700;margin:12px 0 6px;}
  .p-input,.p-static{width:100%;text-align:left;background:#0a0a0a;border:1px solid var(--divider);color:#fff;border-radius:10px;padding:12px 14px;font-family:var(--font);font-size:14px;}
  .p-static{color:var(--text-dim);}
  .p-actions{display:flex;align-items:center;gap:10px;margin-top:16px;}
  .p-status{font-size:12px;color:var(--green);}
  .logout-btn{width:100%;margin-top:18px;padding:13px;border-radius:999px;background:transparent;border:1px solid rgba(255,122,122,.5);color:#ff8a8a;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;}
  .logout-btn:active{background:rgba(255,122,122,.12);}

  .file-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--divider);border-radius:10px;padding:11px 14px;}
  .file-row .pick-btn{flex:none;background:var(--green);color:#0a0a0a;border:none;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);}
  .file-row .pick-name{flex:1;font-size:12.5px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .upload-bar{height:4px;border-radius:2px;background:rgba(255,255,255,0.1);overflow:hidden;display:none;}
  .upload-bar.show{display:block;}
  .upload-bar span{display:block;height:100%;width:0%;background:var(--green);transition:width .15s;}
  .mt-status{font-size:12px;color:var(--text-dim);}
</style>

<script>
  // ----- Fecha de inicio real -----
  const START_DATE = new Date("2024-10-19T00:00:00");
  function updateClock(){
    const now = new Date();
    let diff = Math.max(0, now - START_DATE);
    const day=86400000,hour=3600000,min=60000;
    const days=Math.floor(diff/day); diff-=days*day;
    const hours=Math.floor(diff/hour); diff-=hours*hour;
    const mins=Math.floor(diff/min); diff-=mins*min;
    const secs=Math.floor(diff/1000);
    document.getElementById('clockValue').textContent = `${days}d ${hours}h ${mins}m ${secs}s`;
  }
  updateClock(); setInterval(updateClock,1000);

  // ----- Canciones (reemplaza frase/significado/nota/audio por lo real, o edítalo desde admin.html) -----
  const songs = [
    { id:"song1", title:"Mary Es Mi Amor", artist:"Dedicada a ti", grad:"linear-gradient(135deg,#7a2f4a,#c98a3e)",
      audio:"mari es mi amor.mp3", cover:"sin ti mari.gif",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción.", note:"Escribe tu dedicatoria aquí.",
      liked:false, herNote:"" },
    { id:"song2", title:"Si Supieras", artist:"Dedicada a ti", grad:"linear-gradient(135deg,#4a2a5c,#a9702c)",
      audio:"si supieras kevin karl.mp3", cover:"kevin3.gif",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción.", note:"Escribe tu dedicatoria aquí.",
      liked:false, herNote:"" },
    { id:"song3", title:"San Lucas", artist:"Dedicada a ti", grad:"linear-gradient(135deg,#5c2a3a,#caa15c)",
      audio:"san lucas.mp3", cover:"kevin-sanlucas.gif",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción.", note:"Escribe tu dedicatoria aquí.",
      liked:false, herNote:"" },
    { id:"song4", title:"Zoe Luna", artist:"Dedicada a ti", grad:"linear-gradient(135deg,#1ed760,#0a3d20)",
      audio:"luna de zoe.mp3", cover:"zoe-luna.gif",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción.", note:"Escribe tu dedicatoria aquí.",
      liked:false, herNote:"" },
    { id:"song5", title:"Tú Sí Eres Real", artist:"Dedicada a ti", grad:"linear-gradient(135deg,#7a2f4a,#4a2a5c)",
      audio:"tu si eres real kevin karl.mp3", cover:"tu si eres real kevin.gif",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción.", note:"Escribe tu dedicatoria aquí.",
      liked:false, herNote:"" }
  ];
  document.getElementById('songCount').textContent = `${songs.length} canciones · nuestra playlist`;

  const list = document.getElementById('panel-canciones');
  let currentIndex = null;
  let isPlaying = false;
  const mini = document.getElementById('miniplayer');
  const audio = new Audio(); // reproductor único: sigue sonando al cerrar la ficha

  function fmtTime(t){
    if(!isFinite(t)) return '0:00';
    const m = Math.floor(t/60), s = Math.floor(t%60);
    return `${m}:${s<10?'0':''}${s}`;
  }

  const mySongs = [];
  let playlist = songs; // lista que se está reproduciendo (nuestras o mías)
  const listMine = document.getElementById('panel-mias-list');
  const bgOf = s => (s.cover ? `url('${s.cover}') center/cover no-repeat, ` : '') + s.grad;

  function renderInto(container, arr){
    container.innerHTML = '';
    if(!arr.length){
      container.innerHTML = '<div class="empty"><span>Aún no hay canciones</span>Agrega la primera con el botón de arriba.</div>';
      return;
    }
    arr.forEach((s,i)=>{
      const row = document.createElement('div');
      row.className = 'track' + (playlist===arr && currentIndex===i && isPlaying ? ' playing' : '');
      row.innerHTML = `
        <div class="t-num">${i+1}</div>
        <div class="cover" style="background:${bgOf(s)}">
          <div class="bars"><span></span><span></span><span></span></div>
        </div>
        <div class="t-meta">
          <div class="t-title"></div>
          <div class="t-artist"></div>
        </div>
        <svg class="heart${s.liked?' liked':''}" viewBox="0 0 24 24" fill="${s.liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21s-6.7-4.35-9.3-8.1C.7 9.6 2 6 5.4 5.1 7.7 4.5 9.9 5.6 12 8c2.1-2.4 4.3-3.5 6.6-2.9C22 6 23.3 9.6 21.3 12.9 18.7 16.65 12 21 12 21z"/></svg>
      `;
      row.querySelector('.t-title').textContent = s.title;
      row.querySelector('.t-artist').textContent = s.artist || '';
      row.querySelector('.heart').addEventListener('click', (e)=>{ e.stopPropagation(); toggleHeart(arr,i); });
      row.addEventListener('click', ()=>{
        if(playlist!==arr){ playlist = arr; currentIndex = null; }
        openSheet(i);
      });
      container.appendChild(row);
    });
  }
  function renderTracks(){ renderInto(list, songs); renderInto(listMine, mySongs); }
  renderTracks();

  // ----- Firestore: sincroniza canciones (título/frase/nota/corazón/nota de ella) -----
  function initFirestoreSongs(){
    const { db, doc, getDoc, setDoc, updateDoc, onSnapshot } = window.fb;
    songs.forEach((s, i)=>{
      const ref = doc(db, 'songs', s.id);
      getDoc(ref).then(snap=>{
        if(!snap.exists()){ setDoc(ref, s); } // primera vez: siembra los datos por defecto
      });
      onSnapshot(ref, snap=>{
        if(!snap.exists()) return;
        Object.assign(songs[i], snap.data());
        renderTracks();
        if(playlist===songs && currentIndex===i) refreshNowPlayingUI();
        if(sheetIsOpen && playlist===songs && currentIndex===i) document.getElementById('herNoteInput').value = playlist[i].herNote || '';
      });
    });
  }
  function toggleHeart(arr,i){
    arr[i].liked = !arr[i].liked;
    renderTracks();
    if(window.fb){
      const { db, doc, updateDoc } = window.fb;
      updateDoc(doc(db, arr===songs ? 'songs' : 'mySongs', arr[i].id), { liked: arr[i].liked }).catch(()=>{});
    }
  }
  document.getElementById('herNoteSave').addEventListener('click', ()=>{
    if(currentIndex===null || playlist!==songs) return;
    const val = document.getElementById('herNoteInput').value;
    songs[currentIndex].herNote = val;
    if(window.fb){
      const { db, doc, updateDoc } = window.fb;
      updateDoc(doc(db,'songs',songs[currentIndex].id), { herNote: val }).catch(()=>{});
    }
  });

  // ----- Firestore: mis canciones + perfiles -----
  const GRADS = ["linear-gradient(135deg,#7a2f4a,#c98a3e)","linear-gradient(135deg,#4a2a5c,#a9702c)","linear-gradient(135deg,#5c2a3a,#caa15c)","linear-gradient(135deg,#1ed760,#0a3d20)","linear-gradient(135deg,#2a3a5c,#7d5230)"];
  let allMine = [];
  const profiles = {};
  let pendingPhoto = null;

  function refreshMine(){
    const keep = (playlist===mySongs && currentIndex!==null) ? mySongs[currentIndex] : null;
    mySongs.length = 0;
    allMine.filter(x=>x.owner===myRole).sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(x=>mySongs.push(x));
    if(keep){ const ni = mySongs.findIndex(x=>x.id===keep.id); if(ni>=0) currentIndex = ni; }
    renderTracks();
  }
  function avatarHTML(role, photo){
    return photo ? `<img src="${photo}" alt="">` : `<svg><use href="#${role==='bodoca'?'panda':'bear'}"/></svg>`;
  }
  function applyProfile(){
    if(!myRole) return;
    const p = profiles[myRole] || {};
    const name = p.name || (myRole==='bodoca' ? 'Bodoca' : 'Bodoco');
    document.querySelector('.hero .greeting').textContent = `Hola, ${name} 💚`;
    document.getElementById('avatarInner').innerHTML = avatarHTML(myRole, p.photo);
    document.getElementById('pAvatar').innerHTML = avatarHTML(myRole, pendingPhoto || p.photo);
    document.getElementById('pRole').textContent = myRole==='bodoca' ? 'Bodoca' : 'Bodoco';
    const inp = document.getElementById('pName');
    if(document.activeElement!==inp) inp.value = name;
    const u = USERS[myRole];
    document.getElementById('pBirth').textContent = `${u.d} de ${MESES[u.m-1].toLowerCase()} de ${u.y}`;
  }
  function initFirestoreExtra(){
    const { db, collection, onSnapshot } = window.fb;
    onSnapshot(collection(db,'mySongs'), snap=>{
      allMine = [];
      snap.forEach(d=>allMine.push({ id:d.id, ...d.data() }));
      refreshMine();
    });
    onSnapshot(collection(db,'users'), snap=>{
      snap.forEach(d=>{ profiles[d.id] = d.data(); });
      applyProfile();
    });
  }
  if(window.fb){ initFirestoreSongs(); initFirestoreExtra(); }
  else window.addEventListener('firebase-ready', ()=>{ initFirestoreSongs(); initFirestoreExtra(); });

  // Agregar "mis canciones" (con subida directa a Cloudinary)
  const CLOUD_NAME = 'k1irg52e';
  const UPLOAD_PRESET = 'Para ti';
  let pickedAudio = null, pickedCover = null;

  document.getElementById('toggleAddSong').addEventListener('click', ()=>{
    const f = document.getElementById('addSongForm');
    f.style.display = f.style.display==='none' ? 'flex' : 'none';
  });
  document.getElementById('mtAudioBtn').addEventListener('click', ()=>document.getElementById('mtAudioFile').click());
  document.getElementById('mtCoverBtn').addEventListener('click', ()=>document.getElementById('mtCoverFile').click());
  document.getElementById('mtAudioFile').addEventListener('change', (e)=>{
    pickedAudio = e.target.files[0] || null;
    document.getElementById('mtAudioName').textContent = pickedAudio ? pickedAudio.name : 'Sin archivo';
  });
  document.getElementById('mtCoverFile').addEventListener('change', (e)=>{
    pickedCover = e.target.files[0] || null;
    document.getElementById('mtCoverName').textContent = pickedCover ? pickedCover.name : 'Opcional';
  });

  function cloudinaryUpload(file, resourceType, onProgress){
    return new Promise((resolve, reject)=>{
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`);
      xhr.upload.onprogress = (e)=>{ if(e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload = ()=>{
        try{
          const res = JSON.parse(xhr.responseText);
          if(xhr.status>=200 && xhr.status<300 && res.secure_url) resolve(res.secure_url);
          else reject(res.error ? res.error.message : 'Error al subir');
        }catch(err){ reject('Respuesta inválida de Cloudinary'); }
      };
      xhr.onerror = ()=>reject('Falló la conexión');
      const fd = new FormData();
      fd.append('file', file);
      fd.append('upload_preset', UPLOAD_PRESET);
      xhr.send(fd);
    });
  }

  document.getElementById('mtSave').addEventListener('click', async ()=>{
    if(!window.fb || !myRole) return;
    const title = document.getElementById('mtTitle').value.trim();
    if(!title || !pickedAudio) return;
    const bar = document.getElementById('mtBar'), fill = document.getElementById('mtBarFill');
    const status = document.getElementById('mtStatus'), saveBtn = document.getElementById('mtSave');
    saveBtn.disabled = true; bar.classList.add('show');
    try{
      status.textContent = 'Subiendo canción…';
      const audioUrl = await cloudinaryUpload(pickedAudio, 'video', p=>{ fill.style.width = (p*70)+'%'; });
      let coverUrl = '';
      if(pickedCover){
        status.textContent = 'Subiendo portada…';
        coverUrl = await cloudinaryUpload(pickedCover, 'image', p=>{ fill.style.width = (70 + p*30)+'%'; });
      } else { fill.style.width = '100%'; }
      const { db, collection, addDoc } = window.fb;
      await addDoc(collection(db,'mySongs'), {
        owner: myRole, title, artist: document.getElementById('mtArtist').value.trim(),
        audio: audioUrl, cover: coverUrl,
        grad: GRADS[Math.floor(Math.random()*GRADS.length)], liked:false, ts: Date.now()
      });
      status.textContent = '✓ Canción agregada';
      ['mtTitle','mtArtist'].forEach(id=>document.getElementById(id).value='');
      pickedAudio = null; pickedCover = null;
      document.getElementById('mtAudioName').textContent = 'Sin archivo';
      document.getElementById('mtCoverName').textContent = 'Opcional';
      setTimeout(()=>{
        document.getElementById('addSongForm').style.display = 'none';
        bar.classList.remove('show'); fill.style.width = '0%'; status.textContent = '';
      }, 900);
    }catch(err){
      status.textContent = 'No se pudo subir: ' + err;
      bar.classList.remove('show'); fill.style.width = '0%';
    }finally{
      saveBtn.disabled = false;
    }
  });

  function setPlayIcons(playing){
    const shape = playing
      ? '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>'
      : '<path d="M8 5v14l11-7z"/>';
    document.getElementById('mpIcon').innerHTML = shape;
    document.getElementById('sheetPlayIcon').innerHTML = shape;
  }

  function refreshNowPlayingUI(){
    if(currentIndex===null) return;
    const s = playlist[currentIndex];
    const bg = bgOf(s);
    document.getElementById('mpCover').style.background = bg;
    document.getElementById('mpTitle').textContent = s.title;
    document.getElementById('mpArtist').textContent = s.artist;
    document.getElementById('sheetBg').style.background = s.grad;
    document.getElementById('sheetCover').style.background = bg;
    document.getElementById('sheetTitle').textContent = s.title;
    document.getElementById('sheetArtist').textContent = s.artist;
    document.getElementById('sheetPhrase').textContent = s.phrase || '';
    document.getElementById('sheetMeaning').textContent = s.meaning || '';
    document.getElementById('sheetNote').textContent = s.note || '';
    const ours = playlist===songs;
    ['blkPhrase','blkMeaning','blkNote','blkHer'].forEach(id=>{ document.getElementById(id).style.display = ours ? '' : 'none'; });
  }

  function playIndex(i){
    currentIndex = i;
    const s = playlist[i];
    audio.src = s.audio;
    audio.currentTime = 0;
    audio.play().then(()=>{ isPlaying=true; setPlayIcons(true); renderTracks(); }).catch(()=>{ isPlaying=false; setPlayIcons(false); });
    mini.classList.add('show');
    refreshNowPlayingUI();
  }
  function togglePlay(){
    if(currentIndex===null){ playIndex(0); return; }
    if(audio.paused){ audio.play().then(()=>{isPlaying=true; setPlayIcons(true); renderTracks();}).catch(()=>{}); }
    else { audio.pause(); isPlaying=false; setPlayIcons(false); renderTracks(); }
  }
  function nextTrack(){ if(playlist.length) playIndex((currentIndex + 1) % playlist.length); }
  function prevTrack(){ if(playlist.length) playIndex((currentIndex - 1 + playlist.length) % playlist.length); }

  document.getElementById('mpPlayBtn').addEventListener('click', (e)=>{ e.stopPropagation(); togglePlay(); });
  mini.addEventListener('click', ()=>{ if(currentIndex!==null) openSheet(currentIndex); });
  document.getElementById('heroPlay').addEventListener('click', togglePlay);
  audio.addEventListener('timeupdate', ()=>{
    if(audio.duration){
      const pct = (audio.currentTime/audio.duration*100)+'%';
      document.getElementById('mpProgress').style.width = pct;
      document.getElementById('sheetProgressFill').style.width = pct;
      document.getElementById('sheetTimeCur').textContent = fmtTime(audio.currentTime);
      document.getElementById('sheetTimeDur').textContent = fmtTime(audio.duration);
    }
  });
  audio.addEventListener('loadedmetadata', ()=>{
    document.getElementById('sheetTimeDur').textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('ended', ()=> nextTrack());

  // Detail sheet
  const sheet = document.getElementById('sheet');
  let sheetIsOpen = false;
  function openSheet(i){
    if(currentIndex !== i){ playIndex(i); }
    else { refreshNowPlayingUI(); }
    document.getElementById('sheetProgressFill').style.width = audio.duration ? (audio.currentTime/audio.duration*100)+'%' : '0%';
    document.getElementById('sheetTimeCur').textContent = fmtTime(audio.currentTime);
    document.getElementById('sheetTimeDur').textContent = fmtTime(audio.duration || 0);
    setPlayIcons(!audio.paused);
    document.getElementById('herNoteInput').value = songs[i].herNote || '';
    sheet.classList.add('open');
    if(!sheetIsOpen){
      sheetIsOpen = true;
      history.pushState({ sheetOpen:true }, '', '#cancion');
    }
  }
  function closeSheetVisual(){
    sheet.classList.remove('open'); // el audio sigue sonando, como en Spotify
    sheetIsOpen = false;
  }
  window.addEventListener('popstate', ()=>{
    if(profileOpen) closeProfileVisual();
    else if(sheetIsOpen) closeSheetVisual();
  });
  document.getElementById('sheetPlayBtn').addEventListener('click', togglePlay);
  document.getElementById('sheetNextBtn').addEventListener('click', nextTrack);
  document.getElementById('sheetPrevBtn').addEventListener('click', prevTrack);
  document.getElementById('sheetProgressBar').addEventListener('click', (e)=>{
    if(!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    audio.currentTime = ratio * audio.duration;
  });
  document.getElementById('closeSheet').addEventListener('click', ()=>{
    if(sheetIsOpen) history.back(); // dispara popstate, que cierra la ficha (no sale de la página)
  });

  // Tabs
  document.querySelectorAll('.tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('panel-canciones').style.display = tab==='canciones' ? '' : 'none';
      document.getElementById('panel-mias').style.display = tab==='mias' ? '' : 'none';
    });
  });

  // ----- Perfil (avatar arriba a la derecha) -----
  let profileOpen = false;
  const psheet = document.getElementById('psheet'), pBack = document.getElementById('pBack');
  function openProfile(){
    if(profileOpen || !myRole) return;
    profileOpen = true; pendingPhoto = null; applyProfile();
    psheet.classList.add('open'); pBack.classList.add('open');
    history.pushState({ profile:true }, '', '#perfil');
  }
  function closeProfileVisual(){
    profileOpen = false;
    psheet.classList.remove('open'); pBack.classList.remove('open');
  }
  document.getElementById('avatarBtn').addEventListener('click', openProfile);
  pBack.addEventListener('click', ()=>{ if(profileOpen) history.back(); });

  document.getElementById('pCam').addEventListener('click', ()=>document.getElementById('pFile').click());
  document.getElementById('pFile').addEventListener('change', (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = ()=>{
      const S = 240, c = document.createElement('canvas'); c.width = c.height = S;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
      pendingPhoto = c.toDataURL('image/jpeg', 0.82);
      URL.revokeObjectURL(url);
      applyProfile();
      if(window.fb && myRole){
        const { db, doc, setDoc } = window.fb;
        setDoc(doc(db,'users',myRole), { photo: pendingPhoto }, { merge:true })
          .then(()=>flashStatus('✓ Foto guardada')).catch(()=>flashStatus('No se pudo guardar'));
      }
    };
    img.src = url;
    e.target.value = '';
  });
  function flashStatus(t){
    const st = document.getElementById('pStatus'); st.textContent = t;
    setTimeout(()=>{ st.textContent = ''; }, 2200);
  }
  document.getElementById('pSave').addEventListener('click', ()=>{
    if(!window.fb || !myRole) return;
    const name = document.getElementById('pName').value.trim().slice(0,24);
    if(!name) return;
    const { db, doc, setDoc } = window.fb;
    setDoc(doc(db,'users',myRole), { name }, { merge:true })
      .then(()=>flashStatus('✓ Guardado')).catch(()=>flashStatus('No se pudo guardar'));
  });
  document.getElementById('pLogout').addEventListener('click', ()=>{
    if(profileOpen){ closeProfileVisual(); history.back(); }
    if(sheetIsOpen) closeSheetVisual();
    audio.pause(); isPlaying = false; currentIndex = null; playlist = songs;
    setPlayIcons(false); mini.classList.remove('show');
    try{ localStorage.removeItem('paraTiRole'); }catch(e){}
    myRole = null; chosenRole = null; pendingPhoto = null;
    mySongs.length = 0; renderTracks();
    document.body.classList.add('locked');
    gate.classList.remove('hide');
    showStep('stepRole');
  });
  // ----- Login (portón bonito: la fecha vive en el código, es un detalle, no seguridad real) -----
  const USERS = {
    bodoca:{ d:16, m:5, y:2000, hello:"Hola, bodoca 💚" },
    bodoco:{ d:28, m:6, y:2004, hello:"Hola, bodoco 💚" }
  };
  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const ITEM_H = 44;
  const gate = document.getElementById('gate');
  let chosenRole = null;
  let myRole = null;

  function fillWheel(el, items){
    el.innerHTML = items.map(t=>`<div>${t}</div>`).join('');
  }
  const wDay = document.getElementById('wDay'), wMonth = document.getElementById('wMonth'), wYear = document.getElementById('wYear');
  fillWheel(wDay, Array.from({length:31},(_,i)=>i+1));
  fillWheel(wMonth, MESES);
  fillWheel(wYear, Array.from({length:36},(_,i)=>1980+i));

  function wheelIndex(el){ return Math.max(0, Math.round(el.scrollTop / ITEM_H)); }
  function markSel(el){
    const idx = wheelIndex(el);
    [...el.children].forEach((c,i)=>c.classList.toggle('sel', i===idx));
    return idx;
  }
  [wDay,wMonth,wYear].forEach(el=>{
    let last = -1;
    el.addEventListener('scroll', ()=>{
      const idx = markSel(el);
      if(idx!==last){ last=idx; if(navigator.vibrate) navigator.vibrate(4); }
    }, {passive:true});
  });
  function setWheels(d,m,y){
    wDay.scrollTop = (d-1)*ITEM_H;
    wMonth.scrollTop = (m-1)*ITEM_H;
    wYear.scrollTop = (y-1980)*ITEM_H;
    [wDay,wMonth,wYear].forEach(markSel);
  }
  function showStep(id){
    document.querySelectorAll('.gate-step').forEach(x=>x.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function unlock(role){
    myRole = role;
    try{ localStorage.setItem('paraTiRole', role); }catch(e){}
    gate.classList.add('hide');
    document.body.classList.remove('locked');
    applyProfile();
    refreshMine();
    applyRole();
  }
  function applyRole(){
    // Ella escribe su nota; él solo la lee
    const box = document.getElementById('herNoteInput');
    const save = document.getElementById('herNoteSave');
    const title = box.closest('.block').querySelector('h3');
    if(myRole==='bodoco'){
      box.readOnly = true; save.style.display = 'none';
      box.placeholder = 'Aquí verás lo que ella te escriba…';
      title.textContent = 'Su nota para ti';
    } else {
      box.readOnly = false; save.style.display = '';
      title.textContent = 'Tu nota para él';
    }
  }
  document.querySelectorAll('.role-card').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      chosenRole = btn.dataset.role;
      document.getElementById('dateTitle').textContent = chosenRole==='bodoca' ? 'Tu cumpleaños, bodoca' : 'Tu cumpleaños, bodoco';
      document.getElementById('gateErr').textContent = '';
      showStep('stepDate');
      setWheels(1, 1, 2002); // arranque neutro
    });
  });
  document.getElementById('gateBack').addEventListener('click', ()=>showStep('stepRole'));
  document.getElementById('gateEnter').addEventListener('click', ()=>{
    const u = USERS[chosenRole];
    const d = wheelIndex(wDay)+1, m = wheelIndex(wMonth)+1, y = 1980+wheelIndex(wYear);
    if(d===u.d && m===u.m && y===u.y){ unlock(chosenRole); }
    else {
      const p = document.getElementById('picker');
      document.getElementById('gateErr').textContent = 'Mmm, esa fecha no es. Intenta de nuevo 💭';
      p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake');
    }
  });
  // Si ya entró antes en este celular, pasa directo
  try{
    const saved = localStorage.getItem('paraTiRole');
    if(saved && USERS[saved]) unlock(saved);
  }catch(e){}
</script>
</body>
</html>
