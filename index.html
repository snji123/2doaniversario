<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --surface:#181818;
    --surface-2:#282828;
    --surface-hover:#2a2a2a;
    --text:#ffffff;
    --text-dim:#a7a7a7;
    --green:#1ed760;
    --green-dim:#1aa34a;
    --divider: rgba(255,255,255,0.08);
    --font: 'Poppins', -apple-system, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f5f5f5; --surface:#ffffff; --surface-2:#ececec; --surface-hover:#e6e6e6;
      --text:#0a0a0a; --text-dim:#5c5c5c; --divider: rgba(0,0,0,0.08);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow-x:hidden;}
  body{padding-top:env(safe-area-inset-top,0px);}
  ::-webkit-scrollbar{display:none;}

  .wrap{max-width:480px;margin:0 auto;width:100%;padding-bottom:110px;}

  /* Hero */
  .hero{
    position:relative; padding:22px 20px 24px;
    background:radial-gradient(120% 160% at 30% -10%, #3a1030 0%, #1a0a17 45%, var(--bg) 78%);
    overflow:hidden;
  }
  .hero::after{
    content:''; position:absolute; inset:0;
    background:radial-gradient(60% 50% at 80% 0%, rgba(30,215,96,0.18), transparent 70%);
    pointer-events:none;
  }
  .greeting{font-size:13px;color:var(--text-dim);font-weight:500;position:relative;z-index:1;}
  .playlist-title{
    font-size:34px; font-weight:800; margin:6px 0 4px; letter-spacing:-0.5px;
    position:relative; z-index:1;
  }
  .playlist-sub{font-size:13px;color:var(--text-dim);position:relative;z-index:1;}

  .hero-actions{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:22px; position:relative; z-index:1;
  }
  .icon-btn{
    width:32px;height:32px;border-radius:50%;border:none;background:transparent;
    color:var(--text-dim); display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .play-fab{
    width:56px;height:56px;border-radius:50%;background:var(--green);border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 8px 20px rgba(30,215,96,0.35);
    transition:transform .15s ease;
  }
  .play-fab:active{transform:scale(0.92);}
  .play-fab svg{fill:#0a0a0a;margin-left:3px;}

  /* Stat / clock chip */
  .stat-chip{
    margin:0 20px 6px; padding:14px 16px; border-radius:14px;
    background:var(--surface); border:1px solid var(--divider);
    display:flex; align-items:center; gap:12px;
  }
  .stat-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 8px var(--green);}
  .stat-chip .txt{font-size:13px;color:var(--text-dim);}
  .stat-chip .txt b{color:var(--text);font-weight:700;}

  /* Tabs */
  .tabs{display:flex;gap:8px;padding:16px 20px 6px;}
  .tabs button{
    padding:7px 16px;border-radius:999px;border:1px solid var(--divider);
    background:var(--surface);color:var(--text-dim);font-family:var(--font);
    font-size:13px;font-weight:600;cursor:pointer;transition:.15s ease;
  }
  .tabs button.active{background:var(--text);color:#0a0a0a;border-color:var(--text);}

  main{padding:8px 12px 0;}

  /* Track row */
  .track{
    display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:8px;
    cursor:pointer;transition:background .12s ease;position:relative;
  }
  .track:active{background:var(--surface-hover);}
  .t-num{width:20px;flex:none;text-align:center;font-size:14px;font-weight:600;color:var(--text-dim);}
  .track.playing .t-num{color:var(--green);}
  .cover{
    width:48px;height:48px;border-radius:6px;flex:none;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-size:18px;
    box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  .cover .bars{display:flex;gap:2px;align-items:flex-end;height:14px;opacity:0;transition:opacity .15s;}
  .track.playing .cover .bars{opacity:1;}
  .cover .bars span{width:3px;background:var(--green);border-radius:2px;animation:eq 0.8s ease-in-out infinite;}
  .cover .bars span:nth-child(2){animation-delay:.2s;}
  .cover .bars span:nth-child(3){animation-delay:.4s;}
  @keyframes eq{0%,100%{height:4px;}50%{height:14px;}}
  .t-meta{flex:1;min-width:0;}
  .t-title{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .track.playing .t-title{color:var(--green);}
  .t-artist{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .heart{width:20px;height:20px;flex:none;color:var(--text-dim);}

  .empty{margin-top:60px;text-align:center;color:var(--text-dim);font-size:14px;padding:0 30px;}
  .empty span{display:block;font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;}

  /* Mini player */
  .miniplayer{
    position:fixed;left:0;right:0;bottom:0;z-index:15;
    background:linear-gradient(135deg,#2a1030,#1a1a1a);
    border-top:1px solid var(--divider);
    padding:10px 14px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
    display:none; align-items:center; gap:12px;
    transform:translateY(0); transition:transform .25s ease;
  }
  .miniplayer.show{display:flex;cursor:pointer;}
  .mp-cover{width:40px;height:40px;border-radius:6px;flex:none;}
  .mp-meta{flex:1;min-width:0;}
  .mp-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mp-artist{font-size:11px;color:var(--text-dim);}
  .mp-play{width:34px;height:34px;border-radius:50%;background:var(--green);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .mp-play svg{fill:#0a0a0a;}
  .mp-progress{position:absolute;top:0;left:0;height:2px;background:var(--green);width:0%;transition:width .1s linear;}

  /* Detail sheet */
  .sheet{
    position:fixed;inset:0;background:var(--bg);z-index:30;
    transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .sheet.open{transform:translateY(0);}
  .sheet-bg{position:absolute;inset:0;z-index:-1;opacity:.55;}
  .sheet-inner{max-width:480px;margin:0 auto;width:100%;flex:1;overflow-y:auto;padding:16px 20px 40px;}
  .close-btn{
    width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;
    color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:20px;
  }
  .big-cover{width:100%;aspect-ratio:1/1;border-radius:12px;margin-bottom:20px;box-shadow:0 16px 40px rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;font-size:56px;position:relative;overflow:hidden;}
  .sheet-player-overlay{
    position:absolute;left:0;right:0;bottom:0;padding:20px 16px 16px;
    background:linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
  }
  .sheet-progress-bar{height:3px;border-radius:2px;background:rgba(255,255,255,0.25);margin-bottom:6px;cursor:pointer;overflow:hidden;}
  .sheet-progress-fill{height:100%;width:0%;background:var(--green);border-radius:2px;}
  .sheet-times{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,0.85);margin-bottom:10px;}
  .sheet-controls-row{display:flex;align-items:center;justify-content:center;gap:26px;}
  .sheet-nav-btn{background:none;border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:6px;}
  .sheet-nav-btn svg{fill:currentColor;}
  .sheet-play-btn{
    width:50px;height:50px;border-radius:50%;background:var(--green);border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.45);flex:none;
  }
  .sheet-play-btn svg{fill:#0a0a0a;margin-left:2px;}
  .sheet h2{font-size:24px;font-weight:800;margin:0 0 2px;letter-spacing:-0.3px;}
  .sheet .by{color:var(--text-dim);font-size:13px;margin-bottom:16px;}
  audio{width:100%;margin-bottom:24px;accent-color:var(--green);}
  .block{margin-bottom:18px;}
  .block h3{font-size:11px;letter-spacing:.3px;color:var(--green);margin:0 0 8px;font-weight:700;}
  .block p{margin:0;font-size:15px;line-height:1.6;}
  .phrase{font-style:italic;font-weight:500;font-size:18px;line-height:1.5;}
  .note-box{background:var(--surface);border:1px solid var(--divider);border-radius:14px;padding:16px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="greeting">Hecho para ti</div>
    <h1 class="playlist-title">Para Ti</h1>
    <div class="playlist-sub" id="songCount">5 canciones · nuestra playlist</div>
    <div class="hero-actions">
      <button class="icon-btn" title="Buscar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="play-fab" id="heroPlay" title="Reproducir">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  </div>

  <div class="stat-chip">
    <div class="dot"></div>
    <div class="txt">Llevamos juntos <b id="clockValue">calculando…</b></div>
  </div>

  <nav class="tabs">
    <button class="active" data-tab="canciones">Canciones</button>
    <button data-tab="album">Álbum</button>
  </nav>

  <main>
    <section id="panel-canciones"></section>
    <section id="panel-album" style="display:none;">
      <div class="empty">
        <span>Álbum de fotos</span>
        Aquí vamos a guardar nuestras fotos favoritas. Muy pronto.
      </div>
    </section>
  </main>
</div>

<div class="miniplayer" id="miniplayer">
  <div class="mp-progress" id="mpProgress"></div>
  <div class="mp-cover" id="mpCover"></div>
  <div class="mp-meta">
    <div class="mp-title" id="mpTitle"></div>
    <div class="mp-artist" id="mpArtist"></div>
  </div>
  <button class="mp-play" id="mpPlayBtn">
    <svg id="mpIcon" width="16" height="16" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-inner">
    <button class="close-btn" id="closeSheet">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="big-cover" id="sheetCover">
      <div class="sheet-player-overlay">
        <div class="sheet-progress-bar" id="sheetProgressBar"><div class="sheet-progress-fill" id="sheetProgressFill"></div></div>
        <div class="sheet-times"><span id="sheetTimeCur">0:00</span><span id="sheetTimeDur">0:00</span></div>
        <div class="sheet-controls-row">
          <button class="sheet-nav-btn" id="sheetPrevBtn">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="sheet-play-btn" id="sheetPlayBtn">
            <svg id="sheetPlayIcon" width="20" height="20" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="sheet-nav-btn" id="sheetNextBtn">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <h2 id="sheetTitle"></h2>
    <div class="by" id="sheetArtist"></div>
    <div class="block"><h3>La frase</h3><p class="phrase" id="sheetPhrase"></p></div>
    <div class="block"><h3>Lo que significa</h3><p id="sheetMeaning"></p></div>
    <div class="block"><h3>Mi nota para ti</h3><div class="note-box"><p id="sheetNote"></p></div></div>
  </div>
</div>

<script>
  // ----- Fecha de inicio real -----
  const START_DATE = new Date("2024-10-19T00:00:00");
  function updateClock(){
    const now = new Date();
    let diff = Math.max(0, now - START_DATE);
    const day=86400000,hour=3600000,min=60000;
    const days=Math.floor(diff/day); diff-=days*day;
    const hours=Math.floor(diff/hour); diff-=hours*hour;
    const mins=Math.floor(diff/min); diff-=mins*min;
    const secs=Math.floor(diff/1000);
    document.getElementById('clockValue').textContent = `${days}d ${hours}h ${mins}m ${secs}s`;
  }
  updateClock(); setInterval(updateClock,1000);

  // ----- Canciones (reemplaza frase/significado/nota/audio por lo real) -----
  const songs = [
    { title:"Mary Es Mi Amor", artist:"Dedicada a ti", grad:"linear-gradient(135deg,#7a2f4a,#c98a3e)",
      audio:"mari es mi amor.mp3", cover:"sin ti mari.gif",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción.", note:"Escribe tu dedicatoria aquí." },
    { title:"Si Supieras", artist:"Dedicada a ti", grad:"linear-gradient(135deg,#4a2a5c,#a9702c)",
      audio:"si supieras kevin karl.mp3", cover:"kevin3.gif",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción.", note:"Escribe tu dedicatoria aquí." },
    { title:"San Lucas", artist:"Dedicada a ti", grad:"linear-gradient(135deg,#5c2a3a,#caa15c)",
      audio:"san lucas.mp3", cover:"kevin-sanlucas.gif",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción.", note:"Escribe tu dedicatoria aquí." },
    { title:"Zoe Luna", artist:"Dedicada a ti", grad:"linear-gradient(135deg,#1ed760,#0a3d20)",
      audio:"luna de zoe.mp3", cover:"zoe-luna.gif",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción.", note:"Escribe tu dedicatoria aquí." },
    { title:"Tú Sí Eres Real", artist:"Dedicada a ti", grad:"linear-gradient(135deg,#7a2f4a,#4a2a5c)",
      audio:"tu si eres real kevin karl.mp3", cover:"tu si eres real kevin.gif",
      phrase:"“…”", meaning:"Escribe aquí qué representa esta canción.", note:"Escribe tu dedicatoria aquí." }
  ];
  // Nota: revisa este mapeo de gif↔canción; si no coincide con lo que pensabas, dime cuál va con cuál y lo cambio.
  document.getElementById('songCount').textContent = `${songs.length} canciones · nuestra playlist`;

  const list = document.getElementById('panel-canciones');
  let currentIndex = null;
  let isPlaying = false;
  const mini = document.getElementById('miniplayer');
  const audio = new Audio(); // reproductor único: sigue sonando al cerrar la ficha

  function fmtTime(t){
    if(!isFinite(t)) return '0:00';
    const m = Math.floor(t/60), s = Math.floor(t%60);
    return `${m}:${s<10?'0':''}${s}`;
  }

  function renderTracks(){
    list.innerHTML = '';
    songs.forEach((s,i)=>{
      const row = document.createElement('div');
      row.className = 'track' + (currentIndex===i && isPlaying ? ' playing' : '');
      row.innerHTML = `
        <div class="t-num">${i+1}</div>
        <div class="cover" style="background:url('${s.cover}') center/cover no-repeat, ${s.grad}">
          <div class="bars"><span></span><span></span><span></span></div>
        </div>
        <div class="t-meta">
          <div class="t-title">${s.title}</div>
          <div class="t-artist">${s.artist}</div>
        </div>
        <svg class="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6.7-4.35-9.3-8.1C.7 9.6 2 6 5.4 5.1 7.7 4.5 9.9 5.6 12 8c2.1-2.4 4.3-3.5 6.6-2.9C22 6 23.3 9.6 21.3 12.9 18.7 16.65 12 21 12 21z"/></svg>
      `;
      row.addEventListener('click', ()=>openSheet(i));
      list.appendChild(row);
    });
  }
  renderTracks();

  function setPlayIcons(playing){
    const shape = playing
      ? '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>'
      : '<path d="M8 5v14l11-7z"/>';
    document.getElementById('mpIcon').innerHTML = shape;
    document.getElementById('sheetPlayIcon').innerHTML = shape;
  }

  function refreshNowPlayingUI(){
    if(currentIndex===null) return;
    const s = songs[currentIndex];
    const bg = `url('${s.cover}') center/cover no-repeat, ${s.grad}`;
    document.getElementById('mpCover').style.background = bg;
    document.getElementById('mpTitle').textContent = s.title;
    document.getElementById('mpArtist').textContent = s.artist;
    document.getElementById('sheetBg').style.background = s.grad;
    document.getElementById('sheetCover').style.background = bg;
    document.getElementById('sheetTitle').textContent = s.title;
    document.getElementById('sheetArtist').textContent = s.artist;
    document.getElementById('sheetPhrase').textContent = s.phrase;
    document.getElementById('sheetMeaning').textContent = s.meaning;
    document.getElementById('sheetNote').textContent = s.note;
  }

  function playIndex(i){
    currentIndex = i;
    const s = songs[i];
    audio.src = s.audio;
    audio.currentTime = 0;
    audio.play().then(()=>{ isPlaying=true; setPlayIcons(true); renderTracks(); }).catch(()=>{ isPlaying=false; setPlayIcons(false); });
    mini.classList.add('show');
    refreshNowPlayingUI();
  }
  function togglePlay(){
    if(currentIndex===null){ playIndex(0); return; }
    if(audio.paused){ audio.play().then(()=>{isPlaying=true; setPlayIcons(true); renderTracks();}).catch(()=>{}); }
    else { audio.pause(); isPlaying=false; setPlayIcons(false); renderTracks(); }
  }
  function nextTrack(){ playIndex((currentIndex + 1) % songs.length); }
  function prevTrack(){ playIndex((currentIndex - 1 + songs.length) % songs.length); }

  document.getElementById('mpPlayBtn').addEventListener('click', (e)=>{ e.stopPropagation(); togglePlay(); });
  mini.addEventListener('click', ()=>{ if(currentIndex!==null) openSheet(currentIndex); });
  document.getElementById('heroPlay').addEventListener('click', togglePlay);
  audio.addEventListener('timeupdate', ()=>{
    if(audio.duration){
      const pct = (audio.currentTime/audio.duration*100)+'%';
      document.getElementById('mpProgress').style.width = pct;
      document.getElementById('sheetProgressFill').style.width = pct;
      document.getElementById('sheetTimeCur').textContent = fmtTime(audio.currentTime);
      document.getElementById('sheetTimeDur').textContent = fmtTime(audio.duration);
    }
  });
  audio.addEventListener('loadedmetadata', ()=>{
    document.getElementById('sheetTimeDur').textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('ended', ()=> nextTrack());

  // Detail sheet
  const sheet = document.getElementById('sheet');
  let sheetIsOpen = false;
  function openSheet(i){
    if(currentIndex !== i){ playIndex(i); }
    else { refreshNowPlayingUI(); }
    document.getElementById('sheetProgressFill').style.width = audio.duration ? (audio.currentTime/audio.duration*100)+'%' : '0%';
    document.getElementById('sheetTimeCur').textContent = fmtTime(audio.currentTime);
    document.getElementById('sheetTimeDur').textContent = fmtTime(audio.duration || 0);
    setPlayIcons(!audio.paused);
    sheet.classList.add('open');
    if(!sheetIsOpen){
      sheetIsOpen = true;
      history.pushState({ sheetOpen:true }, '', '#cancion');
    }
  }
  function closeSheetVisual(){
    sheet.classList.remove('open'); // el audio sigue sonando, como en Spotify
    sheetIsOpen = false;
  }
  window.addEventListener('popstate', ()=>{
    if(sheetIsOpen) closeSheetVisual();
  });
  document.getElementById('sheetPlayBtn').addEventListener('click', togglePlay);
  document.getElementById('sheetNextBtn').addEventListener('click', nextTrack);
  document.getElementById('sheetPrevBtn').addEventListener('click', prevTrack);
  document.getElementById('sheetProgressBar').addEventListener('click', (e)=>{
    if(!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    audio.currentTime = ratio * audio.duration;
  });
  document.getElementById('closeSheet').addEventListener('click', ()=>{
    if(sheetIsOpen) history.back(); // dispara popstate, que cierra la ficha (no sale de la página)
  });

  // Tabs
  document.querySelectorAll('.tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('panel-canciones').style.display = tab==='canciones' ? '' : 'none';
      document.getElementById('panel-album').style.display = tab==='album' ? '' : 'none';
    });
  });
</script>
</body>
</html>
